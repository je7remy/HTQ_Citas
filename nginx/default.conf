# ---------------------------------------------------------------------------
# SGCM — configuración Nginx con terminación TLS.
#
# Dos server blocks:
#   1) :80  → redirige TODO el tráfico a HTTPS (301). Mantiene compatibilidad
#             con quien escriba la URL sin https://; nadie navega en claro.
#   2) :443 → servidor real con TLS. Sirve los estáticos del frontend y hace
#             proxy_pass al backend FastAPI bajo /api/.
#
# El certificado es autofirmado para la intranet aislada del HTQPJB. Se genera
# con scripts/gen-cert.sh (Linux/Docker) o scripts/gen-cert.ps1 (Windows) y se
# monta en /etc/nginx/certs vía docker-compose. Ver sección "Despliegue con
# TLS" del README para regenerarlo con el hostname/IP real del servidor.
# ---------------------------------------------------------------------------

# (1) HTTP — solo redirige a HTTPS
server {
    listen 80;
    server_name _;

    # Redirección permanente: cualquier ruta pedida en claro se reenvía
    # a la misma ruta sobre HTTPS. 301 para que el navegador la cachee.
    return 301 https://$host$request_uri;
}

# (2) HTTPS — servidor real
server {
    listen 443 ssl;
    server_name _;

    # Certificado y llave montados desde nginx/certs/ (volumen docker-compose).
    ssl_certificate     /etc/nginx/certs/sgcm.crt;
    ssl_certificate_key /etc/nginx/certs/sgcm.key;

    # TLS endurecido: solo 1.2 y 1.3 (1.0/1.1 están deprecados y son inseguros).
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10M;

    # Headers de seguridad básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # HSTS: fuerza HTTPS en el navegador por 1 año. Seguro aquí porque el
    # bloque :80 ya redirige; max-age moderado por ser intranet autofirmada.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Frontend estático
    root /usr/share/nginx/html/templates;
    index login.html;

    # Vendor (Tailwind, Lucide, FullCalendar, xlsx): inmutables, cache largo.
    # Sirven íntegramente desde el propio host — SGCM funciona sin internet.
    location /static/vendor/ {
        alias /usr/share/nginx/html/static/vendor/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fuentes locales (Inter .woff2 + inter.css)
    location /static/fonts/ {
        alias /usr/share/nginx/html/static/fonts/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # CORS para que @font-face no falle si la página se sirve desde un host distinto
        add_header Access-Control-Allow-Origin "*";
    }

    # Resto de estáticos del proyecto (css/sgcm.css, js/app.js, etc.)
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 7d;
    }

    # Proxy a la API FastAPI
    location /api/ {
        proxy_pass         http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto ahora refleja https: el backend sabe que el
        # cliente llegó cifrado aunque el hop nginx→api sea HTTP interno.
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }
}
